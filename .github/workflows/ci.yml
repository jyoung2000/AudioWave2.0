name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build (Linux)
    runs-on: ubuntu-latest
    # The player's full browser suite runs in the sharded job below; this one keeps everything else.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Generate contracts + fixtures and check they are committed
        run: |
          pnpm generate
          git diff --exit-code -- packages/contracts/generated packages/test-fixtures/generated/audio/manifest.json
      - name: Lint
        run: pnpm lint
      - name: Formatting (same gate as scripts/verify.mjs)
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, DOM, contract, integration and security tests
        run: pnpm test && pnpm test:security
      - name: Build all products
        run: pnpm build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Performance budgets (measured from the build above)
        run: pnpm test:perf
      - name: Single-file build, and check the committed copy is current
        run: |
          pnpm build:local
          git diff --exit-code -- now-playing.html
      - name: Styleguide build, and check its sources, coverage, tokens and committed copy
        run: |
          pnpm styleguide:build
          pnpm styleguide:check
          git diff --exit-code -- docs/design/styleguide.html
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Styleguide PDF
        run: pnpm styleguide:pdf
      - name: Upload the styleguide
        uses: actions/upload-artifact@v4
        with:
          name: styleguide
          path: |
            docs/design/styleguide.html
            docs/design/styleguide.pdf
          if-no-files-found: error
      - name: Dependency audit (high and critical fail the build)
        run: pnpm audit --audit-level=high
      - name: Accessibility, hub, styleguide and single-file browser tests
        run: |
          pnpm test:a11y
          pnpm --filter @now-playing/hub test:e2e
          pnpm --filter @now-playing/aqua-ui test:e2e
          pnpm test:local
      - name: Upload the single-file player
        uses: actions/upload-artifact@v4
        with:
          # The same file is committed at the repository root; this is for downloading a build of a
          # branch that has not been merged yet.
          name: now-playing-single-file
          path: now-playing.html
          if-no-files-found: error
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            music-player/playwright-report
            music-player/playwright-report-local
            docker-container/playwright-report
          if-no-files-found: ignore

  player-e2e:
    # The player's suite is ~180 browser tests on one worker (they share a preview server and storage):
    # 50-80 minutes on a runner, so it is split four ways and each quarter runs on its own machine.
    name: Player browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build all products
        run: pnpm generate && pnpm build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Player end-to-end tests, shard ${{ matrix.shard }} of 4
        run: pnpm --filter @now-playing/music-player test:e2e --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-player-${{ matrix.shard }}
          path: music-player/playwright-report
          if-no-files-found: ignore

  docker:
    name: Hub image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-container/Dockerfile
          push: false
          load: true
          tags: now-playing-hub:ci
      - name: Smoke test container (healthz on 4546, bootstrap login forces password change)
        run: |
          # The image runs as `node` (uid 1000). A bind-mount directory Docker creates itself is owned
          # by root, and the hub could not write its database there.
          mkdir -p .ci-data
          sudo chown 1000:1000 .ci-data
          # NP_CONTAINER=1 (set by the image) makes the hub listen on 0.0.0.0 inside the container, so
          # the loopback-only published port reaches it.
          docker run -d --name hub -p 127.0.0.1:4546:4546 -v "$PWD/.ci-data:/data" now-playing-hub:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4546/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:4546/healthz
          curl -fsS -c cookies.txt -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}' http://127.0.0.1:4546/api/v1/auth/login | tee login.json
          grep -q '"mustChangePassword":true' login.json
      - name: Container logs
        if: always()
        run: |
          docker logs hub 2>&1 | tail -50 || true
          docker rm -f hub || true
