name: Windows companion

on:
  push:
    branches: ['**']
    paths:
      - 'windows-companion/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-companion.yml'
  workflow_dispatch:
  release:
    types: [published]

# Read-only by default; only the release job below can write (to attach the installer to a release).
permissions:
  contents: read

concurrency:
  group: windows-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Type-check, test, package (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Optional code-signing inputs. When they are absent the build is unsigned, electron-builder
      # skips signing, and latest.json records `signed: false` — the app's About screen and the
      # download page both tell people what that means for SmartScreen.
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Multi-line steps run under bash (with -e): pwsh would only report the last command's exit
      # code, so a failing first command would pass silently.
      - name: Generated contracts are committed and current
        shell: bash
        run: |
          pnpm generate
          git diff --exit-code -- packages/contracts/generated

      - name: Lint
        run: pnpm exec eslint windows-companion packages

      - name: Typecheck
        shell: bash
        run: |
          pnpm --filter "./packages/*" typecheck
          pnpm --filter @now-playing/windows-companion typecheck

      - name: Tests (unit, contract, integration, security)
        run: pnpm exec vitest run --project unit --project dom --project contracts --project integration --project security windows-companion packages

      - name: Build main process and renderer
        run: pnpm --filter @now-playing/windows-companion build
        env:
          # Baked into the bundle, so the About screen states what this build actually is rather
          # than reading a variable on the user's machine. Same source as the release metadata.
          NP_RELEASE_SIGNED: ${{ secrets.WINDOWS_CSC_LINK != '' }}

      - name: Package installer and portable build
        run: pnpm --filter @now-playing/windows-companion package

      - name: Write checksums and latest.json
        run: pnpm --filter @now-playing/windows-companion release-metadata
        env:
          NP_RELEASE_BASE_URL: ${{ github.event_name == 'release' && format('{0}/{1}/releases/download/{2}', github.server_url, github.repository, github.event.release.tag_name) || '' }}
          # Truthy only when a certificate secret actually exists; never assumed.
          NP_RELEASE_SIGNED: ${{ secrets.WINDOWS_CSC_LINK != '' }}
          NP_RELEASE_CHANNEL: ${{ github.event_name == 'release' && 'stable' || 'dev' }}
          NP_RELEASE_NOTES_URL: ${{ github.event_name == 'release' && github.event.release.html_url || '' }}

      - name: Show what was produced
        shell: bash
        run: |
          ls -la windows-companion/release
          cat windows-companion/release/latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-companion-${{ github.sha }}
          path: |
            windows-companion/release/*.exe
            windows-companion/release/SHA256SUMS.txt
            windows-companion/release/latest.json
          if-no-files-found: error

  release:
    name: Attach to release
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access; it runs no project code, just uploads what `package` built.
    permissions:
      contents: write
    steps:
      # First, because `checkout` cleans the workspace and would take the downloaded artifact with
      # it. Only the helper is needed: it is committed, so the release attaches it without a build.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: local-helper/now-playing-helper.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: windows-companion-${{ github.sha }}
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            release/latest.json
            local-helper/now-playing-helper.mjs
