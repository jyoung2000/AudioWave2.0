<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Now Playing Companion">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3f2"/>
      <stop offset="0.5" stop-color="#3b74c8"/>
      <stop offset="1" stop-color="#22508f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- A folder behind the note: this is the one app in the suite that reaches the filesystem. -->
  <path d="M64 168a28 28 0 0 1 28-28h108l40 44h148a28 28 0 0 1 28 28v192a28 28 0 0 1-28 28H92a28 28 0 0 1-28-28z" fill="#ffffff" opacity="0.28"/>
