<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Now Playing">
  <!--
    The maskable variant. Android crops this to whatever shape the launcher uses — a circle, a
    squircle, a rounded square — so the artwork bleeds to every edge and the note is kept inside the
    safe zone (the middle 80%), where no crop can reach it.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3f2"/>
      <stop offset="0.5" stop-color="#3b74c8"/>
      <stop offset="1" stop-color="#22508f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- Same note path as packages/aqua-ui/src/icons/glyphs.tsx, scaled from its 24-unit box. -->
  <g transform="translate(75.6 90.4) scale(12.8)">
    <path fill="#ffffff" fill-opacity="0.96" d="M19.6 3 9.8 5.2a1 1 0 0 0-.8 1v9.7a3.1 3.1 0 1 0 1.6 2.7V9.6l7.6-1.7v5.6a3.1 3.1 0 1 0 1.6 2.7V3.8a.8.8 0 0 0-1-.8z"/>
  </g>
</svg>
