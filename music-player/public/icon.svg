<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Airwave">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb3f2"/>
      <stop offset="0.5" stop-color="#3b74c8"/>
      <stop offset="1" stop-color="#22508f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!--
    The same beamed-eighth-note path as the `note` glyph in packages/aqua-ui/src/icons/glyphs.tsx,
    scaled from its 24-unit box. Drawing it twice is how the app icon ended up mirrored once
    already; tests/unit/icon-glyphs.test.ts now fails if the two ever differ again.
  -->
  <!-- translate centres the path's own box (x 4.4–19.8, y 3–21.7) on the 512 tile:
       256 − 12.1·16 = 62.4 across, 256 − 12.35·16 = 58.5 down. -->
  <g transform="translate(62.4 58.5) scale(16)">
    <path fill="#ffffff" fill-opacity="0.96" d="M19.6 3 9.8 5.2a1 1 0 0 0-.8 1v9.7a3.1 3.1 0 1 0 1.6 2.7V9.6l7.6-1.7v5.6a3.1 3.1 0 1 0 1.6 2.7V3.8a.8.8 0 0 0-1-.8z"/>
  </g>
  <rect x="24" y="24" width="464" height="220" rx="96" fill="url(#gloss)"/>
</svg>
