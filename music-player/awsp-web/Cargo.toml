[package]
name = "awsp-web"
version = "0.1.0"
edition = "2024"
publish = false
description = "The PWA's AWSP client: iroh's browser build, relay-carried, driven from a dedicated worker"

[lib]
crate-type = ["cdylib"]

# Built only for wasm32-unknown-unknown by music-player/scripts/build-awsp-web.mjs. The browser build
# of iroh follows n0-computer/iroh-examples `browser-echo`: no default features, `tls-ring`, the
# `wasm_js` getrandom backend (see .cargo/config.toml) and wasm-bindgen pinned to the CLI's version.
[dependencies]
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
tokio = { version = "1", default-features = false, features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tracing-subscriber-wasm = "0.1.0"
serde_json = "1"
hex = "0.4"
blake3 = { version = "1", default-features = false }

[profile.release]
codegen-units = 1
strip = "symbols"
debug = false
lto = true
opt-level = "z"
panic = "abort"
