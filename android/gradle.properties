org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# youtubedl-android unpacks a Python runtime out of the APK at first run, and it can only do that
# if the native libraries are extracted at install. That is `packaging.jniLibs.useLegacyPackaging =
# true` in app/build.gradle.kts; the old `android.bundle.enableUncompressedNativeLibs` property it
# replaces was removed in AGP 8.1 and now fails the build if present.
