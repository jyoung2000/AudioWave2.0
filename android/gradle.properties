org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# youtubedl-android unpacks a Python runtime out of the APK at first run, and it can only do that
# if the native libraries were stored rather than compressed. Without this the app installs and
# then fails the moment it tries to start the tool.
android.bundle.enableUncompressedNativeLibs=false
